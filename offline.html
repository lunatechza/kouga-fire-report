<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Offline - Kouga Fire Report</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      max-width: 480px;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #b91c1c;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>The Kouga Fire Report app is cached, but new data cannot load. Please reconnect when safe.</p>
    <a class="btn" href="./">Open the app</a>
  </div>
</body>
</html>
